<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->

        <script>

            function gtag() {

        <link rel="shortcut icon" type="image/x-icon" href="/evolved/favicon.ico" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/style.css" />
        <meta charset="UTF-8" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
        <script src="/evolved/Data/Init.js"></script>
        <script>
            // Evolved's own city tree. The links between buildings come from Data/GEN/CityTreeLinks.json,
            // which aow4_diff_tools/citytree.py generates from the game and the mod; everything shown about a
            // building (name, icon, cost, texts) comes from the dump, looked up by resid.

            const ROWS = {
                city: ["townhall", "special", "gold", "mana", "knowledge", "food", "production", "draft", "fish", "lava", "stability", "trade"],
                fortification: ["fortification"],
                throne: ["tower", "affinity"]
            };
            const ROW_LABELS = {
                townhall: "Town Hall",
                special: "Special",
                gold: "Gold",
                mana: "Mana",
                knowledge: "Knowledge",
                food: "Food",
                production: "Production",
                draft: "Draft",
                fish: "Ocean",
                lava: "Lava",
                stability: "Stability",
                trade: "Trade",
                fortification: "Defense",
                tower: "Tower",
                affinity: "Affinity"
            };
            const ROW_COLORS = {
                townhall: "rgb(120, 120, 120)",
                special: "rgb(150, 110, 60)",
                gold: "rgb(118, 107, 43)",
                mana: "rgb(40, 85, 144)",
                knowledge: "rgb(106, 40, 144)",
                food: "rgb(40, 144, 53)",
                production: "rgb(144, 80, 40)",
                draft: "rgb(144, 40, 40)",
                fish: "rgb(40, 144, 141)",
                lava: "rgb(165, 160, 10)",
                stability: "rgb(160, 70, 120)",
                trade: "rgb(173, 151, 26)",
                fortification: "rgb(100, 100, 100)",
                tower: "rgb(40, 120, 90)",
                affinity: "rgb(170, 90, 160)"
            };
            const ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII"];
            // tome cards are coloured by the tome's affinity, as written in the dump (<empirenature> ...)
            const AFFINITY_COLORS = {
                arcana: "rgb(40, 110, 160)",
                chaos: "rgb(150, 40, 30)",
                matter: "rgb(150, 100, 40)",
                nature: "rgb(50, 130, 50)",
                order: "rgb(170, 150, 50)",
                shadow: "rgb(100, 40, 140)"
            };
            const AFFINITY_LABELS = {
                arcana: "Astral",
                chaos: "Chaos",
                matter: "Materium",
                nature: "Nature",
                order: "Order",
                shadow: "Shadow",
                other: "Other"
            };

            let treeLinks = null;
            const structureByResid = new Map();
            const tomeByResid = new Map();

            async function HandlePage() {
                treeLinks = await fetch("/evolved/Data/GEN/CityTreeLinks.json").then((res) => res.json());
                for (const s of jsonStructureUpgrades) structureByResid.set(String(s.resid), s);
                for (const t of jsonTomes) tomeByResid.set(String(t.resid), t);

                SetUpControls();
                DrawTree();
                new ResizeObserver(DrawConnectors).observe(document.getElementById("cityTree"));
            }

            function GameText(msgid) {
                // all.json holds a text id as its id plus the last part as a lowercase field
                const at = msgid.lastIndexOf("@");
                const entry = jsonAllFromPO.find((e) => e.id === msgid.slice(0, at));
                return (entry && entry[msgid.slice(at + 1).toLowerCase()]) || msgid;
            }

            function CultureIcon(culture) {
                const icon = culture.icon || treeLinks.cultures.find((c) => c.key === culture.parent)?.icon;
                return icon ? "/evolved/Icons/Text/" + icon + ".png" : "";
            }

            // ---- controls ----

            function SetUpControls() {
                const hash = new URLSearchParams(location.hash.slice(1));
                const cultureSelect = document.getElementById("cultureSelect");
                for (const c of treeLinks.cultures.filter((c) => !c.parent)) {
                    cultureSelect.add(new Option(GameText(c.name), c.key));
                }
                cultureSelect.value = hash.get("culture") || "feudal";
                FillSubcultures(hash.get("sub"));
                document.getElementById("vampireCheck").checked = hash.get("vampire") === "1";
                document.getElementById("tomeCheck").checked = hash.get("tomes") !== "0";

                cultureSelect.addEventListener("change", () => {
                    FillSubcultures();
                    DrawTree();
                });
                for (const id of ["subcultureSelect", "vampireCheck", "tomeCheck"]) {
                    document.getElementById(id).addEventListener("change", DrawTree);
                }
            }

            function FillSubcultures(wanted) {
                const culture = document.getElementById("cultureSelect").value;
                const subSelect = document.getElementById("subcultureSelect");
                subSelect.innerHTML = "";
                for (const c of treeLinks.cultures.filter((c) => c.parent === culture)) {
                    subSelect.add(new Option(GameText(c.name), c.key));
                }
                if (wanted && [...subSelect.options].some((o) => o.value === wanted)) subSelect.value = wanted;
                document.getElementById("subcultureLabel").style.display = subSelect.options.length ? "" : "none";
            }

            function Selection() {
                const culture = document.getElementById("cultureSelect").value;
                const sub = document.getElementById("subcultureSelect").value;
                return {
                    culture: culture,
                    sub: sub,
                    keys: new Set([culture, sub].filter((k) => k)),
                    vampire: document.getElementById("vampireCheck").checked,
                    tomes: document.getElementById("tomeCheck").checked
                };
            }

            // ---- which buildings this culture gets ----

            function VisibleStructures(sel) {
                const own = (s) => !s.cultures || s.cultures.some((k) => sel.keys.has(k));
                const replaced = new Set();
                for (const s of treeLinks.structures) {
                    if (s.cultures && own(s)) (s.replaces || []).forEach((r) => replaced.add(r));
                }
                return treeLinks.structures.filter(
                    (s) =>
                        own(s) &&
                        !replaced.has(s.resid) &&
                        structureByResid.has(s.resid) &&
                        (!s.variant || (s.variant === "vampire") === sel.vampire)
                );
            }

            // ---- drawing ----

            function DrawTree() {
                const sel = Selection();
                const hash = new URLSearchParams({ culture: sel.culture });
                if (sel.sub) hash.set("sub", sel.sub);
                if (sel.vampire) hash.set("vampire", "1");
                if (!sel.tomes) hash.set("tomes", "0");
                history.replaceState(null, "", "#" + hash);

                const culture = treeLinks.cultures.find((c) => c.key === (sel.sub || sel.culture));
                document.getElementById("cultureIcon").src = CultureIcon(culture);

                const visible = VisibleStructures(sel);
                const tree = document.getElementById("cityTree");
                tree.innerHTML = "";
                tree.append(
                    DrawSection("City", "city", "town_hall_i_town_center", visible),
                    DrawSection("Fortifications", "fortification", "town_hall_i_town_center", visible),
                    // the dump has nothing on the Throne itself, so this section has no root node
                    DrawSection(sel.vampire ? "Vampire Castle" : "Wizard's Tower", "throne", null, visible)
                );
                if (sel.tomes) tree.append(DrawTomes(visible));
                DrawConnectors();
                // needs the icons' styles, so only once they are on the page
                tree.querySelectorAll(".ct-resources").forEach(EvenIcons);
            }

            function DrawSection(title, section, rootKey, visible) {
                const members = visible.filter((s) => s.section === section);
                const inSection = new Map(members.map((s) => [s.resid, s]));

                // column: the Town Hall tier a building needs, and always right of what it upgrades from
                const column = new Map(rootKey ? [[rootKey, 1]] : []);
                const primary = new Map();
                function columnOf(s) {
                    if (column.has(s.resid)) return column.get(s.resid);
                    column.set(s.resid, s.th || 1); // guards against loops
                    const present = s.parents.filter((p) => inSection.has(p));
                    let parentColumn = 0;
                    let parent = rootKey;
                    for (const p of present) {
                        const c = columnOf(inSection.get(p)) + (inSection.get(p).line === "townhall" ? 0 : 1);
                        if (parent === rootKey || c < parentColumn) {
                            parentColumn = c;
                            parent = p;
                        }
                    }
                    primary.set(s.resid, parent);
                    const col = Math.max(s.th || 1, parentColumn);
                    column.set(s.resid, col);
                    return col;
                }
                members.forEach(columnOf);
                if (!rootKey && members.length) {
                    // without a root, a building that needs nothing at all (Desecration Chambers) joins the
                    // first building that does, and the section starts at the first column
                    const starts = members.filter((s) => !primary.get(s.resid) && s.th).map((s) => column.get(s.resid));
                    if (starts.length) {
                        for (const s of members) {
                            if (!primary.get(s.resid) && !s.th) column.set(s.resid, Math.min(...starts));
                        }
                    }
                    const shift = Math.min(...members.map((s) => column.get(s.resid))) - 1;
                    for (const s of members) column.set(s.resid, column.get(s.resid) - shift);
                }

                // rows: each line gets a block of rows; a building stays in its parent's row when it can
                const grid = document.createElement("div");
                grid.className = "ct-grid";
                const holder = document.createElement("div");
                holder.className = "ct-section";
                holder.innerHTML = '<div class="ct-section-title">' + title + "</div>";
                holder.append(grid);

                // the longest chain after a building: the main chain takes the top row
                const depth = new Map();
                function depthOf(resid) {
                    if (depth.has(resid)) return depth.get(resid);
                    depth.set(resid, 0);
                    const kids = members.filter((m) => primary.get(m.resid) === resid);
                    const d = kids.length ? 1 + Math.max(...kids.map((k) => depthOf(k.resid))) : 0;
                    depth.set(resid, d);
                    return d;
                }

                const rowOf = new Map();
                let gridRow = 2;
                let maxColumn = 1;
                const lines = ROWS[section];
                for (const line of lines) {
                    const lineMembers = members
                        .filter((s) => s.line === line)
                        .sort(
                            (a, b) =>
                                column.get(a.resid) - column.get(b.resid) ||
                                depthOf(b.resid) - depthOf(a.resid) ||
                                NameOf(a).localeCompare(NameOf(b))
                        );
                    if (!lineMembers.length && !(line === lines[0])) continue;
                    const taken = new Set();
                    let rows = 1;
                    const place = (key, col, wanted) => {
                        let r = wanted;
                        while (taken.has(r + ":" + col)) r++;
                        taken.add(r + ":" + col);
                        rows = Math.max(rows, r + 1);
                        rowOf.set(key, gridRow + r);
                        maxColumn = Math.max(maxColumn, col);
                    };
                    if (rootKey && line === lines[0]) place(rootKey, 1, 0);
                    for (const s of lineMembers) {
                        const p = primary.get(s.resid);
                        const sameLine = p !== rootKey && inSection.get(p)?.line === line;
                        place(s.resid, column.get(s.resid), sameLine ? rowOf.get(p) - gridRow : 0);
                    }
                    const label = document.createElement("div");
                    label.className = "ct-row-label";
                    label.textContent = ROW_LABELS[line];
                    label.style.gridRow = gridRow + " / span " + rows;
                    label.style.borderColor = ROW_COLORS[line];
                    grid.append(label);
                    gridRow += rows;
                }

                // column headers: the Town Hall a column needs
                for (let c = 1; c <= maxColumn; c++) {
                    const head = document.createElement("div");
                    head.className = "ct-col-head";
                    head.textContent = section === "throne" ? "" : c <= 4 ? "Town Hall " + ROMAN[c] : "";
                    head.style.gridColumn = c + 1;
                    grid.append(head);
                }

                if (rootKey) {
                    const root = treeLinks.roots.find((r) => r.key === rootKey);
                    grid.append(PlaceNode(RootNode(root), rowOf.get(rootKey), 1, rootKey));
                }
                for (const s of members) {
                    const node = PlaceNode(StructureNode(s), rowOf.get(s.resid), column.get(s.resid), s.resid);
                    node.dataset.parent = primary.get(s.resid);
                    grid.append(node);
                }
                grid.style.gridTemplateColumns = "110px repeat(" + maxColumn + ", var(--ct-cell))";
                return holder;
            }

            function PlaceNode(node, row, col, key) {
                node.style.gridRow = row;
                node.style.gridColumn = col + 1;
                node.dataset.key = key;
                return node;
            }

            function DrawTomes(visible) {
                // a group per affinity (a dual tome's first one; every-affinity tomes under Other), by tome tier
                const holder = document.createElement("div");
                holder.className = "ct-section";
                holder.innerHTML = '<div class="ct-section-title">Tome Buildings</div>';

                const placed = visible
                    .filter((s) => s.section === "tome")
                    .map((s) => {
                        const tome = tomeByResid.get(String(s.tome)) || {};
                        const affinities = TomeAffinities(tome);
                        const group = affinities.length && affinities.length <= 2 ? affinities[0] : "other";
                        return { s, group, tier: parseInt(tome.tier) || 0 };
                    })
                    .sort(
                        (a, b) =>
                            a.tier - b.tier || TomeName(a.s).localeCompare(TomeName(b.s)) || NameOf(a.s).localeCompare(NameOf(b.s))
                    );

                for (const group of [...Object.keys(AFFINITY_COLORS), "other"]) {
                    const members = placed.filter((p) => p.group === group);
                    if (!members.length) continue;
                    const head = document.createElement("div");
                    head.className = "ct-tome-group";
                    head.textContent = AFFINITY_LABELS[group];
                    head.style.borderColor = AFFINITY_COLORS[group] || ROW_COLORS.townhall;
                    const list = document.createElement("div");
                    list.className = "ct-tome-list";
                    for (const p of members) list.append(StructureNode(p.s));
                    holder.append(head, list);
                }
                return holder;
            }

            // ---- one building ----

            function NameOf(s) {
                return structureByResid.get(s.resid).name.replaceAll("<br>", " ").replaceAll("</br>", " ");
            }

            function TomeAffinities(tome) {
                return [...new Set([...(tome.affinities || "").matchAll(/<empire(\w+)>/g)].map((m) => m[1]))];
            }

            function TomeName(s) {
                return (s.tome && tomeByResid.get(String(s.tome))?.name) || "";
            }

            function RootNode(root) {
                const name = GameText(root.name);
                const node = NodeShell(name, "/evolved/Icons/" + root.icon + ".png", "townhall");
                const tip = document.createElement("span");
                tip.innerHTML = '<span style="color: #d7c297">' + name.toUpperCase() + "</span>";
                addTooltipListeners(node, tip);
                return node;
            }

            function StructureNode(s) {
                const info = structureByResid.get(s.resid);
                const name = NameOf(s);
                const node = NodeShell(name, "/evolved/Icons/UpgradeIcons/" + info.icon + ".png", s.line);
                const box = node.firstElementChild;
                const body = box.querySelector(".ct-body");

                const cost = document.createElement("div");
                cost.className = "ct-cost";
                cost.innerHTML = info.cost;
                box.append(cost);

                const resources = findResources(info.prediction_description + info.description);
                if (resources.length) {
                    const res = document.createElement("div");
                    res.className = "ct-resources";
                    res.innerHTML = "+" + resources.join("");
                    if (resources.length > 6) res.classList.add("ct-many"); // Prismatic Tower: two lines, not three
                    body.append(res);
                }

                const tip = document.createElement("span");
                tip.innerHTML = '<span style="color: #d7c297">' + name.toUpperCase() + "</span><br>";
                if (info.description) tip.innerHTML += info.description + "<br>";
                tip.innerHTML += info.prediction_description
                    .replaceAll("<bulletlist>", "")
                    .replaceAll("</bulletlist>", "")
                    .replaceAll("<bullet>", "")
                    .replaceAll("</bullet>", "<br>");
                if (info.requirement_description) tip.innerHTML += "<br>Requirements:" + info.requirement_description;
                if (info.boost_requirements) tip.innerHTML += "<br>Boost Requirements:" + info.boost_requirements;

                // whose building it is: the culture's emblem or the tome's icon
                if (s.cultures) {
                    const sel = Selection();
                    const key = s.cultures.find((k) => sel.keys.has(k)) || s.cultures[0];
                    const culture = treeLinks.cultures.find((c) => c.key === key);
                    const badge = Badge(CultureIcon(culture));
                    badge.classList.add("ct-badge-culture");
                    body.append(badge);
                    tip.innerHTML += "<br>" + GameText(culture.name);
                }
                if (s.tome && tomeByResid.has(String(s.tome))) {
                    const tome = tomeByResid.get(String(s.tome));
                    body.append(Badge("/evolved/Icons/TomeIcons/" + tome.icon + ".png"));
                    // one or two affinities colour the banner; tomes of every affinity stay neutral
                    const affinities = TomeAffinities(tome);
                    const colors = affinities.length <= 2 ? affinities.map((a) => AFFINITY_COLORS[a]).filter((c) => c) : [];
                    box.querySelector(".structureNodeTitle").style.backgroundImage =
                        "linear-gradient(to right, rgb(0,0,0,0), " + (colors.length ? colors : ["rgb(120, 120, 120)"]).join(", ") + ", rgb(0,0,0,0))";
                    tip.innerHTML += "<br>" + tome.name;
                }
                addTooltipListeners(node, tip);
                return node;
            }

            function NodeShell(name, icon, line) {
                const node = document.createElement("div");
                node.className = "ct-node";
                const box = document.createElement("div");
                box.className = "structureNode";
                const title = document.createElement("span");
                title.className = "structureNodeTitle";
                title.innerHTML = '<span style="color: #d7c297">' + name.toUpperCase() + "</span>";
                if (ROW_COLORS[line]) {
                    title.style.backgroundImage = "linear-gradient(to right, rgb(0,0,0,0), " + ROW_COLORS[line] + ", rgb(0,0,0,0))";
                }
                const img = document.createElement("img");
                img.className = "structureNodeIcon";
                img.src = icon;
                img.height = 60;
                // badges and income icons are placed within the body, so a name on two lines moves them along
                const body = document.createElement("div");
                body.className = "ct-body";
                body.append(img);
                box.append(title, body);
                node.append(box);
                return node;
            }

            function Badge(src) {
                const img = document.createElement("img");
                img.className = "ct-badge";
                img.src = src;
                return img;
            }

            // The income icons are drawn with different amounts of empty space around them, so equal boxes
            // still look uneven. Measure each image's visible pixels once, then scale and centre every icon
            // so its drawing is the same size.
            const visibleBoxes = new Map();
            function VisibleBox(url) {
                if (!visibleBoxes.has(url)) {
                    visibleBoxes.set(
                        url,
                        new Promise((resolve) => {
                            const img = new Image();
                            img.onerror = () => resolve(null);
                            img.onload = () => {
                                const w = img.naturalWidth;
                                const h = img.naturalHeight;
                                const canvas = document.createElement("canvas");
                                canvas.width = w;
                                canvas.height = h;
                                const g = canvas.getContext("2d");
                                g.drawImage(img, 0, 0);
                                const alpha = g.getImageData(0, 0, w, h).data;
                                let x0 = w, y0 = h, x1 = -1, y1 = -1;
                                for (let y = 0; y < h; y++) {
                                    for (let x = 0; x < w; x++) {
                                        if (alpha[(y * w + x) * 4 + 3] > 40) {
                                            x0 = Math.min(x0, x); x1 = Math.max(x1, x);
                                            y0 = Math.min(y0, y); y1 = Math.max(y1, y);
                                        }
                                    }
                                }
                                resolve(x1 < 0 ? null : { w, h, x0, y0, x1, y1 });
                            };
                            img.src = url;
                        })
                    );
                }
                return visibleBoxes.get(url);
            }

            async function EvenIcons(container) {
                for (const icon of [...container.children]) {
                    const BOX = icon.offsetWidth || 22; // the icon's box (see .ct-resources > *)
                    const AREA = (BOX * 21) / 22; // every drawing covers as much as a 21px square: narrow ones get taller
                    const MAX = (BOX * 24) / 22; // but no side grows much past the box
                    const url = /url\("?([^")]+)"?\)/.exec(getComputedStyle(icon).content || "");
                    if (!url) {
                        icon.remove(); // a tag without an icon, such as <hyperlink> in "+3 Vision Range"
                        continue;
                    }
                    const b = await VisibleBox(url[1]);
                    if (!b) continue;
                    const fit = BOX / Math.max(b.w, b.h); // object-fit: contain
                    const vw = (b.x1 - b.x0 + 1) * fit;
                    const vh = (b.y1 - b.y0 + 1) * fit;
                    const k = Math.min(AREA / Math.sqrt(vw * vh), MAX / Math.max(vw, vh));
                    const dx = ((b.x0 + b.x1 + 1) / 2 - b.w / 2) * fit;
                    const dy = ((b.y0 + b.y1 + 1) / 2 - b.h / 2) * fit;
                    icon.style.transform = `scale(${k.toFixed(3)}) translate(${(-dx).toFixed(2)}px, ${(-dy).toFixed(2)}px)`;
                }
                if (!container.children.length) container.remove(); // just a "+" left
            }

            function findResources(text) {
                const regex = /\+\d+%?\s*<([^>]+)>/g;
                const resources = new Set();
                let match;
                while ((match = regex.exec(text)) !== null) resources.add(`<${match[1]}></${match[1]}>`);
                return Array.from(resources);
            }

            // ---- lines between buildings ----

            function DrawConnectors() {
                for (const grid of document.querySelectorAll(".ct-grid")) {
                    grid.querySelector("svg")?.remove();
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.classList.add("ct-lines");
                    svg.setAttribute("width", grid.scrollWidth);
                    svg.setAttribute("height", grid.scrollHeight);
                    const origin = grid.getBoundingClientRect();
                    const nodes = new Map([...grid.querySelectorAll(".ct-node")].map((n) => [n.dataset.key, n]));
                    for (const node of nodes.values()) {
                        const parent = nodes.get(node.dataset.parent);
                        if (!parent) continue;
                        const a = parent.firstElementChild.getBoundingClientRect();
                        const b = node.firstElementChild.getBoundingClientRect();
                        const y2 = b.top + b.height / 2 - origin.top;
                        let d;
                        if (b.left > a.right) {
                            const x1 = a.right - origin.left;
                            const y1 = a.top + a.height / 2 - origin.top;
                            const mid = (x1 + b.left - origin.left) / 2;
                            d = `M ${x1},${y1} H ${mid} V ${y2} H ${b.left - origin.left}`;
                        } else {
                            // same column, further down: run down the left side
                            const x = a.left - origin.left - 8;
                            d = `M ${a.left - origin.left},${a.top + a.height / 2 - origin.top} H ${x} V ${y2} H ${b.left - origin.left}`;
                        }
                        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        path.setAttribute("d", d);
                        svg.append(path);
                    }
                    grid.prepend(svg);
                }
            }
        </script>

        <title>Age of Wonders 4 Evolved - City Tree</title>
    </head>

    <body>
        <div id="header"></div>

        <div class="ct-page">
            <div class="textblocktitle">City Tree</div>
            <div class="ct-controls">
                <img id="cultureIcon" class="ct-culture-icon" alt="" />
                <label>Culture <select id="cultureSelect" class="button-random"></select></label>
                <label id="subcultureLabel">Sub-culture <select id="subcultureSelect" class="button-random"></select></label>
                <label class="switch"><input type="checkbox" id="vampireCheck" /> Elder Vampire</label>
                <label class="switch"><input type="checkbox" id="tomeCheck" checked /> Tome Buildings</label>
            </div>
            <div id="cityTree"></div>
        </div>
    </body>
</html>
<style>
    :root {
        --ct-cell: 270px;
    }
    .ct-page {
        padding: 0 16px;
    }
    #cityTree {
        min-width: 0;
    }
    .ct-controls {
        display: flex;
        flex-wrap: wrap;
