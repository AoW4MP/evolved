<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->

            window.dataLayer = window.dataLayer || [];

            }
            gtag("js", new Date());

            gtag("config", "G-CC3NE8PT7K");

        <link rel="shortcut icon" type="image/x-icon" href="/evolved/favicon.ico" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/style.css" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/worldmap.css" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/spellbook.css" />
        <meta charset="UTF-8" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
        <script src="/evolved/Data/Init.js"></script>
        <script src="/evolved/Data/worldmap.js"></script>
        <script src="/evolved/Data/spellbook.js"></script>
        <script>
            // Evolved's own Enchantments page: a tab per affinity, a dual tome's on both of its own. Everything comes from Data/GEN/SpellBook.json (Data/spellbook.js).

            const TABS = [
                ["Generic", "Generic Research"],
                ["Cultures", "Cultures &amp; Pacts"],
                ["Order", "<empireorder></empireorder> Order"],
                ["Chaos", "<empirechaos></empirechaos> Chaos"],
                ["Nature", "<empirenature></empirenature> Nature"],
                ["Materium", "<empirematter></empirematter> Materium"],
                ["Astral", "<empirearcana></empirearcana> Astral"],
                ["Shadow", "<empireshadow></empireshadow> Shadow"],
                ["Other", "Other"]
            ];

            async function HandlePage() {
                const book = await SbLoad();
                SbBoard(TABS, book.spells.filter((s) => s.page === "Enchantment"), (s) => s.tabs, SbSpellCard, { affinity: false });
            }
        </script>

        <title>Age of Wonders 4 Evolved - Enchantments</title>
    </head>

    <body>
        <div id="header"></div>

        <div class="wm-page sb-page">
            <div class="textblocktitle">
                <img src="/evolved/Icons/Interface/TitleIcons/adaptive_armor.png" height="40px" alt="" /> Enchantments
                <img src="/evolved/Icons/Interface/TitleIcons/adaptive_armor.png" height="40px" alt="" />
            </div>
            <div id="tabs" class="wm-tabs"></div>
            <div class="wm-filters">
                <input type="text" class="wm-search" id="filterInput" placeholder="Search all enchantments" />
                <div id="affinities" class="wm-choices"></div>
                <div id="sorts" class="wm-choices"></div>
            </div>
            <div id="panels"></div>
        </div>
    </body>
</html>
