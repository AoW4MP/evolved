<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-CC3NE8PT7K"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-CC3NE8PT7K");
        </script>
        <link rel="shortcut icon" type="image/x-icon" href="/evolved/favicon.ico" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/style.css" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/worldmap.css" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/spellbook.css" />
        <meta charset="UTF-8" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
        <script src="/evolved/Data/Init.js"></script>
        <script src="/evolved/Data/worldmap.js"></script>
        <script src="/evolved/Data/spellbook.js"></script>
        <script>
            // Evolved's own Enchantments page: a tab per where they come from (General Research and the affinities' tomes are
            // Tomes), affinity buttons as filters and, on a row of their own, unit class and unit type buttons. Everything comes from Data/GEN/SpellBook.json (Data/spellbook.js).

            const TABS = [
                ["Tomes", "<knowledge></knowledge> Tomes"],
                ["Cultures", '<img class="wm-tab-pic" src="/evolved/Icons/Interface/DropdownIcons/CultureUnitsIcon.png" alt="" /> Cultures'],
                ["Dwellings", '<img class="wm-tab-pic" src="/evolved/Icons/Interface/DropdownIcons/000004970000159C.png" alt="" /> Dwellings'],
                ["Happenings", '<img class="wm-tab-pic" src="/evolved/Icons/Interface/DropdownIcons/category_icon_Asteroid.png" alt="" /> Happenings']
            ];

            async function HandlePage() {
                const book = await SbLoad();
                SbBoard(TABS, book.spells.filter((s) => s.page === "Enchantment"), (s) => s.tabs, SbSpellCard, { units: true });
            }
        </script>

        <title>Age of Wonders 4 Evolved - Enchantments</title>
    </head>

    <body>
        <div id="header"></div>

        <div class="wm-page sb-page">
            <div class="textblocktitle">
                <img src="/evolved/Icons/Interface/TitleIcons/adaptive_armor.png" height="40px" alt="" /> Enchantments
                <img src="/evolved/Icons/Interface/TitleIcons/adaptive_armor.png" height="40px" alt="" />
            </div>
            <div id="tabs" class="wm-tabs"></div>
            <div class="wm-filters">
                <input type="text" class="wm-search" id="filterInput" placeholder="Search all enchantments" />
                <div id="affinities" class="wm-choices"></div>
                <div id="sorts" class="wm-choices"></div>
                <div class="wm-break"></div>
                <div id="classes" class="wm-choices"></div>
                <div id="types" class="wm-choices"></div>
            </div>
            <div id="panels"></div>
        </div>
    </body>
</html>
