                    <div class="column" id="overviewEnchantmentsHolder"></div>
                    <div class="column" id="overviewOtherSpellHolder"></div>

                    <div class="column" id="overviewUnitsHolder"></div>
                    <div class="column" id="overviewUpgradesHolder"></div>
                    <div class="column" id="overviewSPIHolder"></div>
                    <div class="column" id="overviewSiegeHolder"></div>
                    <div class="column" id="overviewEmpireHolder"></div>
                </div>
            </div>
            </div>
        </div>

        <div class="fc-panel" data-tab="publish" hidden>
            <div id="publish"></div>
        </div>

        <div id="hiddentooltips" style="display: none"></div>

        <div class="selectionsHolder" id="selectionsHolder">
            <div id="selectionsBackdrop" class="selections-backdrop"></div>
            <div class="selections">
                <p id="selections" style="text-align: center"></p>
                <button class="selections-close" title="Close" onclick="toggleOriginButtons()">
                    <img src="/evolved/Icons/Interface/CloseX.png" alt="Close" />
                </button>
                <div id="originWrapperOptions" class="wrappers"></div>
            </div>
        </div>

        </div>

        <script>
            // Copy Share Link: the link to the faction as it is now, in the field and on the clipboard
            function myFunction() {
                GetQuickLink();
                const field = document.getElementById("shareLink");
                const button = document.getElementById("copyButton");
                navigator.clipboard.writeText(field.value).then(() => {
                    button.textContent = "Copied";
                    setTimeout(() => (button.textContent = "Copy Share Link"), 1500);
                });
            }

            // The tabs: the faction, what it has (its count, the overview's entries, follows it as it is made again), and
            // publishing it. One shown at a time: the overview stood beside the faction and pushed it aside
            function FcTabs() {
                const bar = document.getElementById("fcTabs");
                const tabs = [
                    ["faction", '<img class="wm-tab-pic" src="/evolved/Icons/Interface/DropdownIcons/FactionCreator.png" alt="" /> Faction', ""],
                    ["overview", '<img src="/evolved/Icons/Interface/TabIcons/army.png" alt="" /> Overview', "0"],
                    ["publish", '<img class="wm-tab-pic" src="/evolved/Icons/Interface/DropdownIcons/BuildsList.png" alt="" /> Publish', ""]
                ];
                for (const [id, label, count] of tabs) {
                    const tab = WmTab(id, label, count);
                    tab.onclick = () => FcOpenTab(id);
                    bar.append(tab);
                }
                FcOpenTab("faction");
                const overview = document.getElementById("mainoverview");
                const count = () => (bar.querySelector('[data-id="overview"] .wm-count').textContent = overview.querySelectorAll(".overview_list_entry").length);
                new MutationObserver(count).observe(overview, { childList: true, subtree: true });
                count();
            }

            function FcOpenTab(id) {
                document.querySelectorAll("#fcTabs .wm-tab").forEach((t) => t.classList.toggle("selected", t.dataset.id === id));
                document.querySelectorAll(".fc-panel").forEach((p) => (p.hidden = p.dataset.tab !== id));
            }

            // The sheet's rows. Faction.js' SetButtonInfo draws a choice as its picture and a line of its name and tags; FcDress
            // makes that a row: a choice of its own kind gets the game's word for it over its name ("Physical Form",
            // "Starting Tome", a culture's "School" or "Oath"), its tags (affinities, DLC) go to the row's end, and so does a
            // form trait's points ("1: Sharp Eyes" was its name). A dragon type is its own name: the claw's text gave it the
            // claw's damage icon and "- Dragon Claw". The pick-lists' entries are left as they are
            const FC_CAPTIONS = { Origin: "Ruler", Class: "Hero Class", Tome: "Starting Tome", Ascension: "Ascension", Ambition: "Ambition", Form: "Physical Form", Culture: "Culture" };
            const FC_SUBTYPES = { "Dragon Lord": "Dragon Type", "Giant King": "Giant Type", "Elder Vampire": "Vampire Type" };
            // the game's (CULTURE_MYSTIC@SUBCULTURE@NAME...); the Architect's and Primal's have none
            const FC_SUBCULTURES = { Architect: "Affinity", Dark: "Leading Cult", Feudal: "Authority", Mercantile: "Organization", Mystic: "School", Nomad: "Tradition", Oathsworn: "Oath", Primal: "Primal Spirit", Reaver: "Government" };

            function FcRows() {
                const draw = SetButtonInfo;
                SetButtonInfo = function (button, origin, type, inSelectionsList) {
                    draw(button, origin, type, inSelectionsList);
                    if (!inSelectionsList) FcDress(button, origin, type);
                };
                // the faction's affinity: an icon and its number together, so a line too full breaks between affinities
                // (Empire of the Cosmos' checks read an icon and the number after it, which they still are)
                const affinity = affinityToDisplayHtml;
                affinityToDisplayHtml = (text) => affinity(text).replace(/(<(empire\w+)><\/\2>)\s*(\d+)/g, '<span class="fc-aff">$1$3</span>');
            }

            function FcCaption(type) {
                if (type === "SubType") return FC_SUBTYPES[currentOrigin.name] || "Type";
                if (type === "SubCulture") return FC_SUBCULTURES[currentCulture.name] || "";
                return FC_CAPTIONS[type] || "";
            }

            function FcDress(button, origin, type) {
                const name = button.querySelector(":scope > span");
                if (!name) return;
                name.className = "fc-name";
                const tags = document.createElement("span");
                tags.className = "fc-tags";
                while (name.lastChild && (name.lastChild.nodeType === 1 || !name.lastChild.textContent.trim())) {
                    if (name.lastChild.nodeType === 1) tags.prepend(name.lastChild);
                    else name.lastChild.remove();
                }
                if (type === "SubType") name.textContent = origin.name;
                const first = name.firstChild;
                if (first && first.nodeType === 3) {
                    let text = first.textContent.trim().replace(/^(Hero Class|Ascension):\s*/, "");
                    const cost = type === "FormTrait" && text.match(/^(-?\d+):\s*/);
                    if (cost) {
                        text = text.slice(cost[0].length);
                        const points = document.createElement("span");
                        points.className = "fc-points" + (Number(cost[1]) < 0 ? " fc-minus" : "");
                        points.textContent = cost[1];
                        tags.append(points);
                    }
                    first.textContent = text;
                }
                const text = document.createElement("span");
                text.className = "fc-text";
                name.replaceWith(text);
                const caption = FcCaption(type);
                if (caption) {
                    const cap = document.createElement("span");
                    cap.className = "fc-cap";
                    cap.textContent = caption;
                    text.append(cap);
                }
                text.append(name);
                button.append(tags);
            }
        </script>
    </body>
