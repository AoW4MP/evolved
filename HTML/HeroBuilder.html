        <script>
            
            
            var dragonDisableList = ["Ranger"];
            var giantDisableList = ["Ranger"];
            var eldritchDisableList = ["Warrior", "Defender", "Spellblade", "DeathKnight", "Ranger"];
          
                    // GetLocalData();

                    
                

            function populateSelect(id, items) {
                const select = document.getElementById(id);
                items.forEach((item) => {
                    const option = document.createElement("option");
                    option.value = item;
                    option.textContent = item;
                    option.classList = "ClassSelector";
                    option.setAttribute("id", item.replaceAll(" ", ""));
                    select.appendChild(option);
                });
            }
            
          

            function HandlePage() {
                // each time the trees are made: their columns without their empty left margins, and all of them made to fit
                const hbbUpdatePage = UpdatePage;
                UpdatePage = function () {
                    hbbUpdatePage.apply(this, arguments);
                    HbbTrim();
                    HbbFit();
                };
                // and each time a signature skill is picked or removed: the signature column's room
                const hbbSetSignature = setSignatureSelection;
                setSignatureSelection = function () {
                    hbbSetSignature.apply(this, arguments);
                    HbbSigRoom();
                };
                window.addEventListener("resize", HbbFit);
                
                // Get the dropdown element
                    const dropdownOrigin = document.getElementById("actionDropdownOrigin");
                    const dropdownOriginDragon = document.getElementById("actionDropdownOriginDragon");
                    const dropdownOriginGiant = document.getElementById("actionDropdownOriginGiant");
                
                document.getElementById('selectionsBackdrop').addEventListener('click', closePanel);
                    // hide dragon type
                    document.getElementById("actionDropdownOriginDragonHolder").style.display = "none";
                    // hide giant type
                    document.getElementById("actionDropdownOriginGiantHolder").style.display = "none";

                    const dropdown = document.getElementById("actionDropdownClass");
                    // Add an event listener for when the value changes
                    dropdownOrigin.addEventListener("change", function () {
                        rulerSubType = "";
                        document.getElementById("actionDropdownOriginDragonHolder").style.display = "none";
                        document.getElementById("actionDropdownOriginGiantHolder").style.display = "none";
                        // Get the selected value
                        const selectedValue = dropdownOrigin.value;
                        rulerOrigin = selectedValue;

                        // disable all class bits and t hen turn on the right ones
                        document.querySelectorAll(".ClassSelector").forEach((el) => {
                            el.disabled = false;
                        });

                        if (selectedValue == "Dragon") {
                            rulerSubType = "OrderDragon";
                            // show the dragon selection
                            document.getElementById("actionDropdownOriginDragonHolder").style.display = "block";
                            // dont leave ranger
                            document.querySelectorAll(".ClassSelector").forEach((el) => {
                                if (dragonDisableList.includes(el.id)) {
                                    el.disabled = true;
                                }
                            });
                            //   document.getElementById("Ranger").disabled = true;
                            if (rulerClass == "Ranger") {
                                rulerClass = "Warrior";
                            }
                        }
                        if (selectedValue.indexOf("Giant") != -1) {
                            // show the dragon selection
                            document.getElementById("actionDropdownOriginGiantHolder").style.display = "block";

                            rulerSubType = "GiantFire";
                            // dont leave ranger

                            document.querySelectorAll(".ClassSelector").forEach((el) => {
                                if (giantDisableList.includes(el.id)) {
                                    el.disabled = true;
                                }
                            });

                            if (rulerClass == "Ranger") {
                                rulerClass = "Warrior";
                            }
                        }
                        if (selectedValue == "Eldritch") {
                            document.querySelectorAll(".ClassSelector").forEach((el) => {
                                if (eldritchDisableList.includes(el.id)) {
                                    el.disabled = true;
                                }
                            });
                            // no defender, ranger, or warrior?
                            if (
                                rulerClass == "Ranger" ||
                                rulerClass == "Warrior" ||
                                rulerClass == "Defender" ||
                                rulerClass == "Spellblade" ||
                                rulerClass == "Death Knight"
                            ) {
                                rulerClass = "Ritualist";
                                document.getElementById("actionDropdownClass").value = "Ritualist";
                            }
                        }

                        ResetAll();

                        //UpdatePage();

                        // Trigger functions based on the selected value
                    });

                    // Add an event listener for when the value changes
                    dropdownOriginDragon.addEventListener("change", function () {
                        // Get the selected value
                        const selectedValue = dropdownOriginDragon.value;
                        rulerSubType = selectedValue;
                        ResetAll();

                        // Trigger functions based on the selected value
                    });

                    dropdownOriginGiant.addEventListener("change", function () {
                        // Get the selected value
                        const selectedValue = dropdownOriginGiant.value;
                        rulerSubType = selectedValue;
                        ResetAll();

                        // Trigger functions based on the selected value
                    });

                    // Add an event listener for when the value changes
                    dropdown.addEventListener("change", function () {
                        // Get the selected value
                        const selectedValue = dropdown.value;
                        rulerClass = selectedValue;
                        ResetAll();

                        // Trigger functions based on the selected value
                    });
                // dynamic load classes
                var classesList = [];
               // if (showBetaTooltip.checked) {
                   // document.getElementById("Notes").innerHTML = "Elementalist unlock lines have errors, read the skills";
                  //  document.getElementById("shareSection").style.display= "none";
                  //  shareSection
                    classesList = [
                        "Warrior",
                        "Defender",
                        "Ranger",
                        "Elementalist",
                        "Ritualist",
                        "Warlock",
                        "Spellblade",
                        "Death Knight",
                        "Battlesaint"
                    ];
               // } else {
                //    classesList = ["Warrior", "Defender", "Ranger", "Mage", "Ritualist", "Spellblade", "Death Knight"];
                //}
                populateSelect("actionDropdownClass", classesList);
                if (searchKeyword) {
                    TestLoad(searchKeyword);
                } else {
                    ResetAll();
                    // UpdatePage();
                }
                HbbPickers();
                
                
                
                // if (showBetaTooltip.checked) {
    // Combine the original jsonData with the beta entries
   // jsonHeroSkills = [...jsonHeroSkills, ...extraSkills];
      //  jsonHeroSkillsLocalized = [...jsonHeroSkillsLocalized, ...extraSkills];
//}   
        //        jsonUnitAbilities = [...jsonUnitAbilities,...extraAbilities];
        //        jsonUnitAbilitiesLocalized = [...jsonUnitAbilitiesLocalized,...extraAbilities];
            }

            // Copy Share Link: the link to the hero as it is now, in the field and on the clipboard
            function myFunction() {
                GetQuickLinkHero();
                const field = document.getElementById("shareLink");
                const button = document.getElementById("copyButton");
                navigator.clipboard.writeText(field.value).then(() => {
                    button.textContent = "Copied";
                    setTimeout(() => (button.textContent = "Copy Share Link"), 1500);
                });
            }

            // The hero's ruler type, dragon type or clan, and class as rows of buttons. Each sets its select and tells it, as
            // choosing in the select did (HandlePage's listeners: the trees are made again); the selects stay, hidden, as
            // Hero.js reads and sets them (a shared link's hero). HbbSync shows what they hold: the chosen buttons, the
            // classes a ruler type can't be, the dragon types for a Dragon Lord, the clans for a Giant King
            const HBB_RULERS = {
                Champion: ["champion", "Champion"],
                Wizard: ["wizard_king", "Wizard King"],
                Dragon: ["dragon_lord", "Dragon Lord"],
                Eldritch: ["eldritch_sovereign", "Eldritch Sovereign"],
                Giant: ["giant_king", "Giant King"],
                Vampire: ["elder_vampire", "Elder Vampire"],
                // a hero who isn't the ruler: the Champion's tree without Command (SetUpTreeNodes in Hero.js)
                Hero: ["", "Hero"]
            };
            const HBB_DRAGONS = {
                OrderDragon: ["order", "Order"],
                AstralDragon: ["arcana", "Astral"],
                NatureDragon: ["nature", "Nature"],
                ChaosDragon: ["chaos", "Chaos"],
                MateriumDragon: ["matter", "Materium"],
                ShadowDragon: ["shadow", "Shadow"]
            };
            const HBB_CLANS = {
                GiantFire: ["fire_giant_king", "Fire"],
                GiantFrost: ["frost_giant_king", "Frost"],
                GiantStorm: ["storm_giant_king", "Storm"],
                GiantRock: ["rock_giant_king", "Rock"]
            };
            const HBB_CLASS_ICONS = {
                Warrior: "classWarrior",
                Defender: "classDefender",
                Ranger: "classRanger",
                Elementalist: "classMage",
                Ritualist: "classRitualist",
                Warlock: "classWarlock",
                Spellblade: "classSpellblade",
                "Death Knight": "classDeathknight",
                Battlesaint: "classBattlesaint"
            };

            function HbbPickers() {
                const row = (holder, selectId, labels) => {
                    const select = document.getElementById(selectId);
                    for (const option of select.options) {
                        const button = document.createElement("button");
                        button.className = "wm-sort hbb-chip";
                        button.dataset.value = option.value;
                        button.innerHTML = labels(option.value, option.textContent);
                        button.onclick = () => {
                            if (option.disabled || select.value === option.value) return;
                            select.value = option.value;
                            select.dispatchEvent(new Event("change"));
                            HbbSync();
                        };
                        document.getElementById(holder).append(button);
                    }
                };
                const portrait = (id) => '<img src="/evolved/Icons/FactionCreation/' + id + '.png" alt="" />';
                row("hbbRulers", "actionDropdownOrigin", (v, text) => (v === "Hero" ? "<hero></hero>" : portrait(HBB_RULERS[v][0])) + HBB_RULERS[v][1]);
                // Hero, not a ruler type, set a little apart from them
                document.querySelector('#hbbRulers .hbb-chip[data-value="Hero"]').classList.add("hbb-chip-apart");
                row("hbbDragons", "actionDropdownOriginDragon", (v) => "<" + HBB_DRAGONS[v][0] + "></" + HBB_DRAGONS[v][0] + ">" + HBB_DRAGONS[v][1]);
                row("hbbGiants", "actionDropdownOriginGiant", (v) => portrait(HBB_CLANS[v][0]) + HBB_CLANS[v][1]);
                row("hbbClasses", "actionDropdownClass", (v, text) => {
                    const tag = HBB_CLASS_ICONS[v];
                    return (tag ? "<" + tag + "></" + tag + ">" : "") + text;
                });
                HbbSync();
            }

            // A ruler's or class's tree starts 10-155px into its column (the skills' places in the data): its column is pulled
            // in by that, less 10px, its nodes and lines with it (they are placed in the same wrapper).
            // The trees start 50-65px down too, and the signature slots 110px: all three columns are pulled up by the same
            // amount, the first row 10px under its heading, the rows of the three level as they were. The signature column's
            // nodes are placed absolutely, so it is given their room (HbbSigRoom)
            function HbbTrim() {
                for (const [column, holderId] of [["hbbRulerTree", "treeHolder"], ["hbbClassTree", "treeHolderClass"]]) {
                    const holder = document.getElementById(holderId);
                    const lefts = [...holder.children].map((c) => c.offsetLeft);
                    const trim = lefts.length ? Math.max(0, Math.min(...lefts) - 10) : 0;
                    holder.parentElement.style.marginLeft = -trim + "px";
                    document.getElementById(column).style.width = holder.offsetWidth - trim + "px";
                }
                const tops = ["treeHolder", "treeHolderClass"].flatMap((id) => [...document.getElementById(id).children].map((c) => c.offsetTop));
                const up = tops.length ? Math.max(0, Math.min(...tops) - 10) : 0;
                document.querySelectorAll(".hbb-tree").forEach((column) => (column.lastElementChild.style.marginTop = -up + "px"));
                // the signature column's top: the first slot's first unlocked skill (a round one is placed 50px above the
                // slot) level with the class tree's first row. Measured, as the page's own layout sets the column a little
                // lower (its holders are inline blocks); a zoom divided out
                const space = document.getElementById("treespace");
                const zoom = Number(space.style.zoom) || 1;
                const slot = document.querySelector("#treeHolderSignature1 .shape-signature");
                const classTops = [...document.querySelectorAll("#treeHolderClass .unittype_ic")].map((n) => n.getBoundingClientRect().top);
                if (slot && classTops.length) {
                    const off = (slot.getBoundingClientRect().top - 50 * zoom - Math.min(...classTops)) / zoom;
                    const sigWrapper = document.querySelector(".hbb-tree-sig").lastElementChild;
                    sigWrapper.style.marginTop = -up - Math.round(off) + "px";
                }
                HbbSigRoom();
            }

            // The signature column as tall as what it shows: its nodes are placed absolutely, so it had no height of its own,
            // and a picked skill's picture overhangs its node. Measured each time the trees are made and a signature skill
            // is picked or removed, its lowest node and picture, 7px more (31px to the frame's edge, as under the trees). A
            // fixed room for the lowest a skill can go left 100px empty under fewer
            function HbbSigRoom() {
                const column = document.querySelector(".hbb-tree-sig").lastElementChild;
                const zoom = Number(document.getElementById("treespace").style.zoom) || 1;
                column.style.minHeight = "";
                const top = column.getBoundingClientRect().top;
                const lowest = Math.max(0, ...[...column.querySelectorAll(".unittype_ic, .unittype_ic img")].map((n) => n.getBoundingClientRect().bottom - top));
                column.style.minHeight = Math.ceil(lowest / zoom) + 7 + "px";
            }

            // The trees as large as the room allows, at most their own size and at least 60% (a phone's still scroll, their
            // nodes too small to tap below that): a zoom, under which the trees keep their own measures (resizeParentToFitChildren)
            function HbbFit() {
                const space = document.getElementById("treespace");
                space.style.zoom = "";
                const room = space.parentElement.clientWidth;
                const scale = Math.max(0.6, Math.min(1, room / space.offsetWidth));
                space.style.zoom = scale < 1 ? String(scale) : "";
            }

            function HbbSync() {
                // what Hero.js holds, which a ruler type can change without its select (a Dragon Lord's Ranger is a Warrior)
                if (typeof rulerOrigin !== "undefined" && rulerOrigin) document.getElementById("actionDropdownOrigin").value = rulerOrigin;
                if (typeof rulerClass !== "undefined" && rulerClass) document.getElementById("actionDropdownClass").value = rulerClass;
                if (typeof rulerSubType !== "undefined" && rulerSubType) {
                    for (const id of ["actionDropdownOriginDragon", "actionDropdownOriginGiant"]) {
                        const select = document.getElementById(id);
                        if ([...select.options].some((o) => o.value === rulerSubType)) select.value = rulerSubType;
                    }
                }
                const origin = document.getElementById("actionDropdownOrigin").value;
                // the classes the ruler type can't be, as choosing it marks them (a hero opened from a link too)
                const barred = { Dragon: dragonDisableList, Giant: giantDisableList, Eldritch: eldritchDisableList }[origin] || [];
                document.querySelectorAll(".ClassSelector").forEach((o) => (o.disabled = barred.includes(o.id)));
                const mark = (holder, selectId) => {
                    const select = document.getElementById(selectId);
                    document.querySelectorAll("#" + holder + " .hbb-chip").forEach((b) => {
                        const option = [...select.options].find((o) => o.value === b.dataset.value);
                        b.classList.toggle("selected", select.value === b.dataset.value);
                        b.disabled = !!option?.disabled;
                    });
                };
                mark("hbbRulers", "actionDropdownOrigin");
                mark("hbbDragons", "actionDropdownOriginDragon");
                mark("hbbGiants", "actionDropdownOriginGiant");
                mark("hbbClasses", "actionDropdownClass");
                document.getElementById("hbbDragonPick").hidden = origin !== "Dragon";
                document.getElementById("hbbGiantPick").hidden = origin !== "Giant";
                // the trees' headings name them
                const sub = origin === "Dragon" ? document.getElementById("actionDropdownOriginDragon") : origin === "Giant" ? document.getElementById("actionDropdownOriginGiant") : null;
                const ruler = sub ? sub.options[sub.selectedIndex].textContent : HBB_RULERS[origin]?.[1] || origin;
                document.getElementById("hbbRulerLabel").textContent = ruler + " Skills";
                document.getElementById("hbbClassLabel").textContent = document.getElementById("actionDropdownClass").value + " Skills";
            }
        </script>

        <title>Age of Wonders 4 Evolved - Hero Skill Tree Builder</title>
    </head>

    <body>
         <div id="scripts"></div>
        <div id="header"></div>
        
 
        <div class="wm-page hbb-page">
            <div class="textblocktitle">
                <img src="/evolved/Icons/Interface/TitleIcons/HeroBuilder.png" height="40px" alt="" /> Hero Builder
                <img src="/evolved/Icons/Interface/TitleIcons/HeroBuilder.png" height="40px" alt="" />
            </div>

            <div class="fc-toolbar">
                <button class="wm-sort" id="reset" onclick="ResetAll()">Reset All</button>
                <div class="fc-share">
                    <input type="text" value="" class="wm-search" id="shareLink" readonly placeholder="A link to this hero, to share or keep" />
                    <button class="wm-sort selected" id="copyButton" onclick="myFunction()">Copy Share Link</button>
                </div>
                <a class="wm-sort fc-list-link" href="/evolved/HTML/HeroSkillsList.html">Skill List</a>
            </div>

            <!-- the hero: ruler type (and dragon type or clan) and class as buttons (HbbPickers), which set the selects
                 Hero.js reads and sets; its skill points and build name -->
            <div class="hbb-picks">
                <div class="hbb-pick"><span class="wm-label">Ruler Type or Hero</span><div id="hbbRulers" class="wm-choices"></div></div>
                <div class="hbb-break"></div>
                <div class="hbb-pick" id="hbbDragonPick"><span class="wm-label">Dragon Type</span><div id="hbbDragons" class="wm-choices"></div></div>
                <div class="hbb-pick" id="hbbGiantPick"><span class="wm-label">Clan</span><div id="hbbGiants" class="wm-choices"></div></div>
                <div class="hbb-break hbb-break-sub"></div>
                <div class="hbb-pick"><span class="wm-label">Class</span><div id="hbbClasses" class="wm-choices"></div></div>
                <div class="hbb-facts">
                    <div class="hbb-points">
                        <span class="wm-label">Skill Points</span> <span id="currentSkillPoints"></span>
                    </div>
                    <label class="hbb-name"
                        ><span class="wm-label">Build Name</span>
                        <input type="text" value="My Build" class="wm-search" id="buildNameInput" maxlength="60" name="fname"
                    /></label>
                </div>
            </div>

            <div hidden>
                <select id="actionDropdownOrigin">
                    <option id="Champion" value="Champion">Champion</option>
                    <option id="Wizard" value="Wizard">Wizard King</option>
                    <option id="Dragon" value="Dragon">Dragon Lord</option>
                    <option id="Eldritch" value="Eldritch">Eldritch Sovereign</option>
                    <option id="Giant" value="Giant">Giant King</option>
                    <option id="Vampire" value="Vampire">Elder Vampire</option>
                    <option id="Hero" value="Hero">Hero</option>
                </select>
                <div id="actionDropdownOriginDragonHolder">
                    <select id="actionDropdownOriginDragon">
                        <option id="orderDragon" value="OrderDragon">Order Dragon</option>
                        <option id="astralDragon" value="AstralDragon">Astral Dragon</option>
                        <option id="natureDragon" value="NatureDragon">Nature Dragon</option>
                        <option id="chaosDragon" value="ChaosDragon">Chaos Dragon</option>
                        <option id="materiumDragon" value="MateriumDragon">Materium Dragon</option>
                        <option id="shadowDragon" value="ShadowDragon">Shadow Dragon</option>
                    </select>
                </div>
                <div id="actionDropdownOriginGiantHolder">
                    <select id="actionDropdownOriginGiant">
                        <option id="GiantFire" value="GiantFire">Fire Giant King</option>
                        <option id="GiantFrost" value="GiantFrost">Frost Giant King</option>
                        <option id="GiantStorm" value="GiantStorm">Storm Giant King</option>
                        <option id="GiantRock" value="GiantRock">Rock Giant King</option>
                    </select>
                </div>
                <select id="actionDropdownClass"></select>
            </div>

            <!-- the trees: the ruler's, the class's and the signature skills, side by side; scrolling alone where the window
                 is narrower than they are -->
            <div class="hbb-scroll">
                <div class="tree-space" id="treespace">
                    <div style="position: relative; display: flex; justify-content: flex-start">
                        <div class="hbb-tree" id="hbbRulerTree">
                            <div class="hbb-tree-label" id="hbbRulerLabel">Ruler Skills</div>
                            <div style="position: relative; top: 20px">
                                <div class="tree-grid" id="treeHolder"></div>
                                <div class="" id="treeLineHolder"></div>
                            </div>
                        </div>
                        <div class="hbb-tree" id="hbbClassTree">
                            <div class="hbb-tree-label" id="hbbClassLabel">Class Skills</div>
                            <div style="position: relative; top: 20px">
                                <div class="tree-grid" id="treeHolderClass"></div>
                                <div class="" id="treeLineHolderClass"></div>
                            </div>
                        </div>
                        <div class="hbb-tree hbb-tree-sig">
                            <div class="hbb-tree-label">Signature Skills</div>
                            <div style="postion: relative; top: 20px">
                                <div class="tree-grid" style="width: 350px" id="treeHolderSignature1"></div>
                                <div class="" style="position: relative" id="treeLineHolderSignature1"></div>
                                <div class="tree-grid" id="treeHolderSignature2"></div>
                                <div class="" style="position: relative" id="treeLineHolderSignature2"></div>
                                <div class="tree-grid" id="treeHolderSignature3"></div>
                                <div class="" style="position: relative" id="treeLineHolderSignature3"></div>
                                <div class="tree-grid" id="treeHolderSignature4"></div>
                                <div class="" style="position: relative" id="treeLineHolderSignature4"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

          <div class="selectionsHolder" id="selectionsHolder">
            <div id="selectionsBackdrop" class="selections-backdrop"></div>
            <div class="selections">
                <p id="selections" style="text-align: center"></p>
                <button class="selections-close" title="Close" onclick="closePanel()">
                    <img src="/evolved/Icons/Interface/CloseX.png" alt="Close" />
                </button>
                <div id="choicesPanel" class="wrappers"></div>
            </div>
        </div>
        
       
    </body>

                    .selections {

            max-height: 50vh;
                        overflow-y: auto;
                        color: white;
                        border-width: 10px;
                        border-style: solid;
                        border-image: url(/evolved/Icons/9slicetooltip.png);

        transform-origin: left center;
