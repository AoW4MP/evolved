        <script>
            // Evolved's own Landmarks page: all of them or a DLC's, a card each. Everything but the pictures comes from
            // Data/GEN/Landmarks.json, which aow4_diff_tools/worldmap.py generates from the game and the mod.

            async function HandlePage() {
                const data = await fetch("/evolved/Data/GEN/Landmarks.json").then((res) => res.json());
                const panelOf = (list) => {
                    const panel = document.createElement("div");
                    for (const e of list) panel.append(WmLandmark(e));
                    return panel;
                };
                const dlcs = [...new Set(data.landmarks.map((e) => e.dlc))];
                WmTabs([
                    { id: "All", label: "All", count: data.landmarks.length, panel: panelOf(data.landmarks) },
                    ...dlcs.map((dlc) => {
                        const here = data.landmarks.filter((e) => e.dlc === dlc);
                        const label = dlcMap[dlc].text.replace(/^Part of the | DLC$/g, "");
                        return { id: dlc, label: '<img src="' + dlcMap[dlc].src + '" alt="" /> ' + label, count: here.length, panel: panelOf(here) };
                    })
                ]);
            }
        </script>

        <title>Age of Wonders 4 Evolved - Landmarks</title>
    </head>

    <body>
        <div id="header"></div>

        <div class="wm-page">
            <div class="textblocktitle">
                <img src="/evolved/Icons/Interface/TitleIcons/landmark.png" height="40px" alt="" /> Landmarks
                <img src="/evolved/Icons/Interface/TitleIcons/landmark.png" height="40px" alt="" />
            </div>
            <div id="tabs" class="wm-tabs"></div>
            <div id="panels"></div>
        </div>
    </body>
</html>
