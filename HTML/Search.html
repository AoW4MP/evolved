        <style>
            .dlc-button {
  background: none;
  border: none;
  cursor: pointer;
  padding: 5px;
                margin:10px;
  transition: transform 0.1s ease;
                 transform: scale(1.5);
}

.dlc-button:hover {
 filter:brightness(2);
}
        .disabled-section {
  opacity: 0.5;
  pointer-events: none;
}</style>

        <script src="/evolved/Data/Init.js"></script>
        <script src="/evolved/Data/worldmap.js"></script>
        <script src="/evolved/Data/spellbook.js"></script>
        <script src="/evolved/Data/ancientwonders.js"></script>
        <script src="/evolved/Data/magicmaterials.js"></script>
        <script src="/evolved/Data/heroes.js"></script>
        <script src="/evolved/Data/empire.js"></script>
        <script src="/evolved/Data/abilities.js"></script>
        <script>
          
            async function HandlePage() {
                await LoadSearchBooks();
                
                  const unitsToggle = document.getElementById("unitsCheck");
            const unitSubFilters = document.querySelectorAll("#unitSubFilters input[type='checkbox']");
                // Run once on load and whenever it's toggled
            unitsToggle.addEventListener("change", updateUnitSubFilters);
           
                console.log("handling");
                rememberSearch();
                 updateUnitSubFilters();
                // a search asked for while the data loaded (the DLC icons are drawn before it, Data/Search.js)
                if (searchWaiting !== null) searchData(searchWaiting);
            }

            // what a unit is found by, greyed out while Units is off
            function updateUnitSubFilters() {
                const enabled = document.getElementById("unitsCheck").checked;
                document.getElementById("unitSubLabel").style.opacity = enabled ? "1" : "0.5";
                document.querySelectorAll("#unitSubFilters input[type='checkbox']").forEach((cb) => {
                    cb.disabled = !enabled;
                    cb.parentElement.style.opacity = enabled ? "1" : "0.5";
                });
            }
            
            


            
        </script>
        <title>Age of Wonders 4 Evolved - Search</title>
    </head>

    <body>
        <div id="header"></div>

        <div class="w3-container sidebarPage">
            <div class="textblocktitle">DLC List & Search</div>
            <div class="pageHead">
                <div id="unitS" style="max-width: 876px; margin: auto auto 20px; background-color: #0e2229">
                    <div style="height: auto; color: white; text-align: center; padding-top: 12px">DLC Filters:<div id="dlcButtonRow" style="display: flex; flex-wrap: wrap; gap: 6px;    justify-content: center;"></div></div>
                    <div style="height: auto; color: white; text-align: center">
                      <hr style="margin-bottom: 16px">Search Filters:
                        <!-- a switch per section of the menu, each for all its tabs of results; then what a unit is found by -->
                        <div id="searchFilters">
                            <div class="filterLabel">Search in:</div>
                            <div class="filterRow" id="sectionFilters">
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="unitsCheck" checked="checked" />
                                    Units
                                </label>
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="tomesCheck" checked="checked" />
                                    Tomes
                                </label>
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="spellsCheck" checked="checked" />
                                    Spells
                                </label>
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="worldMapCheck" checked="checked" />
                                    World Map
                                </label>
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="heroesCheck" checked="checked" />
                                    Heroes
                                </label>
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="empireCheck" checked="checked" />
                                    Empire
                                </label>
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="abilitiesCheck" checked="checked" />
                                    Abilities
                                </label>
                            </div>
                            <div class="filterLabel" id="unitSubLabel">Units by:</div>
                            <div class="filterRow" id="unitSubFilters">
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="namesCheck" checked="checked" />
                                    Name
                                </label>
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="abilityNamesCheck" checked="checked" />
                                    Ability &amp; Passive Names
                                </label>
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="abilityDescriptionCheck" checked="checked" />
                                    Ability &amp; Passive Texts
                                </label>
                                <label class="switch">
                                    <input type="checkbox" name="checkToggle" id="resistancesCheck" />
                                    Protections &amp; Weaknesses
                                </label>
                            </div>
                        </div>
                    </div>
                    <div id="searchBox" style="margin-right: auto; margin-left: auto; max-width: 500px; padding-top: 6px; padding-bottom: 12px">
                        <input style="width: 400px; max-width: calc(100% - 90px)" type="text" class="searchbar" id="searchInput" />
                        <input class="button-random" type="submit" value="Submit" id="button" />

                        <p id="searchResult" style="color: aqua"></p>
                    </div>
                </div>

                <div id="searchOutputMod"></div>

                <div id="searchOutput"></div>
            </div>
            <div id="buttonHolder" class="w3-bar w3-black"></div>
            <div id="dataHolder" style="position: sticky"></div>
        </div>

        <script>
            $(document).ready(function () {
                $("#button").click(function () {
                    searchData();
                });
                /* $('#buttonMod').click(function() {
             searchDataMod();
         });*/
            });

            $(function () {
                $("#searchInput").keyup(function (event) {
                    if (event.which === 13) {
                        searchData();
                    }
                });
                $("#searchInputMod").keyup(function (event) {
                    if (event.which === 13) {
                        searchDataMod();
                    }
                });
            });
        </script>
        
    </body>
    
</html>
