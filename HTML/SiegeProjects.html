        <link rel="stylesheet" type="text/css" href="/evolved/Style/style.css" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/worldmap.css" />

        <script>
            // Evolved's own Siege Projects page: those anyone has (Generic), those from tomes, and the others, named as
            // Enchantments' tabs are. Everything comes from Data/GEN/SpellBook.json (Data/spellbook.js).

            const TABS = [
                ["Generic", '<img class="wm-tab-pic" src="/evolved/Icons/Interface/DropdownIcons/siegehealth.png" alt="" /> Generic'],
                ["Tomes", "<knowledge></knowledge> Tomes"],
                ["Other", "<skillpoint></skillpoint> Other"]
            ];

            async function HandlePage() {
                const book = await SbLoad();
                SbBoard(TABS, book.siege, (p) => [p.tab], SbSiegeCard);
            }
        </script>

        <title>Age of Wonders 4 Evolved - Siege Projects</title>
    </head>

    <body>
        <div id="header"></div>

        <div class="wm-page sb-page">
            <div class="textblocktitle">
                <img src="/evolved/Icons/Interface/TitleIcons/siegehealth.png" height="40px" alt="" /> Siege Projects
                <img src="/evolved/Icons/Interface/TitleIcons/siegehealth.png" height="40px" alt="" />
            </div>
            <div id="tabs" class="wm-tabs"></div>
            <div class="wm-filters">
                <input type="text" class="wm-search" id="filterInput" placeholder="Search all siege projects" />
                <div id="affinities" class="wm-choices"></div>
                <div id="sorts" class="wm-choices"></div>
            </div>
            <div id="panels"></div>
        </div>
    </body>
