        <script src="/evolved/Data/Init.js"></script>
        <script src="/evolved/Data/worldmap.js"></script>
        <script>
            // Evolved's own Infestations page: a tab per tier, a card per infestation. Everything but the pictures comes from
            // Data/GEN/Infestations.json, which aow4_diff_tools/worldmap.py generates from the game and the mod.

            async function HandlePage() {
                const data = await fetch("/evolved/Data/GEN/Infestations.json").then((res) => res.json());
                WmTabs(
                    Object.keys(WM_TIER_BAND).map((tier) => {
                        const here = data.infestations.filter((e) => e.tier === tier);
                        const panel = document.createElement("div");
                        for (const e of here) panel.append(WmInfestation(e));
                        return { id: tier, label: "<infestation" + tier.toLowerCase() + "></infestation" + tier.toLowerCase() + "> " + tier, count: here.length, panel };
                    })
                );
                WmTabsSearch("Search all infestations");
            }
        </script>

        <title>Age of Wonders 4 Evolved - Infestations</title>
    </head>

    <body>
        <div id="header"></div>

        <div class="wm-page">
            <div class="textblocktitle">
                <img src="/evolved/Icons/Interface/TitleIcons/Infestation.png" height="40px" alt="" /> Infestations
                <img src="/evolved/Icons/Interface/TitleIcons/Infestation.png" height="40px" alt="" />
            </div>
            <div id="tabs" class="wm-tabs"></div>
            <div id="panels"></div>
        </div>
    </body>
</html>
