<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-CC3NE8PT7K"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-CC3NE8PT7K");

        <link rel="shortcut icon" type="image/x-icon" href="/evolved/favicon.ico" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/style.css" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/worldmap.css" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/spellbook.css" />
        <meta charset="UTF-8" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
        <script src="/evolved/Data/Init.js"></script>
        <script src="/evolved/Data/worldmap.js"></script>
        <script src="/evolved/Data/spellbook.js"></script>
        <script>
            // Evolved's own Strategic Spells page: a tab per kind. Everything comes from Data/GEN/SpellBook.json (Data/spellbook.js).

            const TABS = [
                ["Summon", "<summonspell></summonspell> Summon"],
                ["Terraforming", "<terraforming></terraforming> Terraforming"],
                ["EnemyArmy", "<armyspell></armyspell> Enemy Army"],
                ["FriendlyArmy", "<armyspell></armyspell> Friendly Army"],
                ["World", "<worldspell></worldspell> World"],
                ["City", "<cityspell></cityspell> City"],
                ["Victory", "<worldspell></worldspell> Victory"]
            ];

            async function HandlePage() {
                const book = await SbLoad();
                SbBoard(TABS, book.spells.filter((s) => s.page === "Strategic"), (s) => s.tabs, SbSpellCard);
            }
        </script>

        <title>Age of Wonders 4 Evolved - Strategic Spells</title>
    </head>

    <body>
        <div id="header"></div>

        <div class="wm-page sb-page">
            <div class="textblocktitle">
                <img src="/evolved/Icons/Interface/TitleIcons/strategiccombatpoints.png" height="40px" alt="" /> Strategic Spells
                <img src="/evolved/Icons/Interface/TitleIcons/strategiccombatpoints.png" height="40px" alt="" />
            </div>
            <div id="tabs" class="wm-tabs"></div>
            <div class="wm-filters">
                <input type="text" class="wm-search" id="filterInput" placeholder="Search all strategic spells" />
                <div id="affinities" class="wm-choices"></div>
                <div id="sorts" class="wm-choices"></div>
            </div>
            <div id="panels"></div>
        </div>
    </body>
</html>
