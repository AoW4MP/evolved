        <script>
            // Evolved's own Transformations page: Minor and Major. Everything comes from Data/GEN/SpellBook.json (Data/spellbook.js).

            const TABS = [
                ["Minor", "<transformation></transformation> Minor"],
                ["Major", "<transformation></transformation> Major"]
            ];

            async function HandlePage() {
                const book = await SbLoad();
                SbBoard(TABS, book.spells.filter((s) => s.page === "Transformation"), (s) => s.tabs, SbSpellCard);
            }
        </script>

        <title>Age of Wonders 4 Evolved - Transformations</title>

    <body>
        <div id="header"></div>

        <div class="wm-page sb-page">
            <div class="textblocktitle">Transformations</div>
            <div id="tabs" class="wm-tabs"></div>
            <div class="wm-filters">
                <input type="text" class="wm-search" id="filterInput" placeholder="Search all transformations" />
                <div id="affinities" class="wm-choices"></div>
                <div id="sorts" class="wm-choices"></div>
            </div>
            <div id="panels"></div>
