<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->

        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-CC3NE8PT7K");
        </script>
        <link rel="shortcut icon" type="image/x-icon" href="/evolved/favicon.ico" />
        <link rel="stylesheet" type="text/css" href="/evolved/Style/style.css" />
        <meta charset="UTF-8" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

        <script src="/evolved/Data/Init.js"></script>
        <script>
            function HandlePage() {
                GenerateLandingPage();
            }

            async function GenerateLandingPage() {
                // Load your header HTML
                const response = await fetch("/evolved/HTML/header.html");
                const headerHTML = await response.text();

                // Create a hidden DOM from header.html
                const parser = new DOMParser();
                const doc = parser.parseFromString(headerHTML, "text/html");

                // Adjust selector if your menu has a wrapper element
                const menuItems = doc.querySelector("#menu");

                const grid = document.getElementById("grid");
                for (const child of menuItems.children) {
                    //for(let i in menuItems) {
                    const card = document.createElement("div");
                    card.className = "card";

                    // units needs more sub menus

                    const topItem = child;

                    const titleLink = topItem.querySelector("a");
                    const titleText = titleLink ? titleLink.textContent.trim() : "Untitled";

                    if (!titleLink) continue; // the menu's spacer at the end (menuExtras) is no page
                    if (titleLink.id == "menu-units") {
                        for (const unitChild of titleLink.nextElementSibling.children) {
                            const titleLink2 = unitChild.querySelector("a");
                            const titleText2 = titleLink2 ? titleLink2.textContent.trim() : "Untitled";

                            const h2 = document.createElement("h2");
                            h2.className = "header";
                            if (titleLink2) {
                                h2.innerHTML = `<a href="${titleLink2.href}"> Units - ${titleText2}</a>`;
                            } else {
                                h2.textContent = titleText2;
                            }

                            const img = titleLink2.querySelector("img");
                            img.setAttribute("width", "70px");
                            h2.prepend(img);
                            const card2 = document.createElement("div");
                            card2.appendChild(h2);

                            card2.className = "card";
                            const subMenu = unitChild.querySelector("ul");
                            if (subMenu) {
                                const ul = document.createElement("ul");
                                subMenu.querySelectorAll("li a").forEach((subLink) => {
                                    const li = document.createElement("li");
                                     li.className = "list";
                                    const img = subLink.querySelector("img");
                                      const text = subLink.textContent.trim();
                                      li.innerHTML = `<a id="${subLink.id}" href="${subLink.href}">`+ img.outerHTML + text +`</a>`;
                              
                                    //li.innerHTML = `<a href="${subLink.href}">${subLink.textContent.trim()}</a>`;
                                  
                                    ul.appendChild(li);
                                });
                                card2.appendChild(ul);
                            }

                            grid.appendChild(card2);
                        }
                    } else {
                        const h2 = document.createElement("h2");
                        if (titleLink) {
                            h2.innerHTML = `<a id="${titleLink.id}" href="${titleLink.href}">${titleText}</a>`;
                        } else {
                            h2.textContent = titleText;
                        }
                         h2.className = "header";
                        const img = titleLink.querySelector("img");
                         img.setAttribute("width", "70px");
                        h2.prepend(img);
                        card.appendChild(h2);

                        const subMenu = topItem.querySelector("ul");
                        if (subMenu) {
                            const ul = document.createElement("ul");
                            subMenu.querySelectorAll("li a").forEach((subLink) => {
                               
                                const li = document.createElement("li");
                                li.className = "list";
                                const img = subLink.querySelector("img");
                                 const text = subLink.textContent.trim();
                                li.innerHTML = `<a id="${subLink.id}" href="${subLink.href}">`+ img.outerHTML + text +`</a>`;
                               
                                 
                               
                                
                                ul.appendChild(li);
                            });
                            card.appendChild(ul);
                        }
                        grid.appendChild(card);
                    }
                }
            }
        </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Age of Wonders 4 Evolved</title>
        <style>
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 20px;
                max-width: 1200px;
                margin: 0 auto;
            }
            
            .header {
                margin: 0 0 22px;
                text-align: center;
            }

            .header img {
                display: block;
                margin: 0 auto 4px;
            }

            .header a {
                font-size: 18px;
            }

            .card ul {
                list-style: none;
                padding: 0;
                margin: 0;
                text-align: center;
            }

            .list {
                padding-bottom: 5px;
                font-size: large;
            }

            /* style.css sets every link to 14px */
            .list a {
                font-size: 18px;
            }

            /* most icons have transparent padding; the affinity icons, DLC logos and a few others fill theirs */
            .list img {
                width: 32px;
                margin-right: 4px;
                vertical-align: middle;
            }

            .list img[src$="/astral.png"],
            .list img[src$="/nature.png"],
            .list img[src$="/shadow.png"],
            .list img[src$="/order.png"],
            .list img[src$="/chaos.png"],
            .list img[src$="/materium.png"],
            .list img[src$="/dual.png"],
            .list img[src$="/DragonDawn.png"],
            .list img[src$="/empireAshes.png"],
            .list img[src$="/PrimalFury.png"],
            .list img[src$="/EldritchRealms.png"],
            .list img[src$="/waysofwar.png"],
            .list img[src$="/GKLogo.png"],
            .list img[src$="/ArchonProphecy.png"],
            .list img[src$="/ThronesOfBlood.png"],
            .list img[src$="/RiseFromRuin.png"],
            .list img[src$="/equipment.png"],
            .list img[src$="/siegehealth.png"] {
                width: 24px;
                margin: 4px 8px 4px 4px; /* keeps the 32px footprint so rows stay evenly spaced */
            }

            .list img[src$="/piercing_shot.png"],
            .list img[src$="/ascended_artificer_hero_skill_normal.png"],
            .list img[src$="/arcane_surge_2.png"] {
                width: 28px;
                margin: 2px 6px 2px 2px;
            }

            /* taller than wide */
            .list img[src$="/mine.png"] {
                width: 23px;
                margin: 1px 9px 1px 4px;
            }

            .card {
                position: relative;

                float: left;

                background-image: url(/evolved/Icons/Interface/panel_Background.png);
                background-size: cover;
                font-size: 15px;
                color: #bbcdf6;
                text-align: left;
                border-width: 10px;
                border-style: solid;
                border-image: url(/evolved/Icons/9slicetooltip.png);
                border-image-slice: 10 10 10 10;
                text-shadow: 2px 2px 3px black;
                box-shadow: 0 0 5px 5px rgba(0, 0, 0, 0.3);

                padding: 10px;
                margin: 5px;
            }
        </style>
    </head>
    <body>
        <h1>Age of Wonders 4 Evolved</h1>

        <div class="grid" id="grid">
            <!-- Units -->
        </div>
    </body>
</html>
